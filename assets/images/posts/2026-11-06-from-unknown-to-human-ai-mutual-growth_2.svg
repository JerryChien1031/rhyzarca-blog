 <radialGradient id="a"><stop stop-color="#e9a477" stop-opacity=".22"/><stop offset="1" stop-color="#e9a477" stop-opacity="0"/></radialGradient>
 <radialGradient id="b"><stop stop-color="#77a7e9" stop-opacity=".24"/><stop offset="1" stop-color="#77a7e9" stop-opacity="0"/></radialGradient>
 <radialGradient id="c"><stop stop-color="#74e3bc" stop-opacity=".23"/><stop offset="1" stop-color="#74e3bc" stop-opacity="0"/></radialGradient>
 <linearGradient id="line" x1="0" x2="1"><stop stop-color="#efc4a0"/><stop offset=".48" stop-color="#a1b9ef"/><stop offset="1" stop-color="#a0f0ca"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#283e59" stop-opacity=".95"/><stop offset="1" stop-color="#112331" stop-opacity=".98"/></linearGradient>
