<text x="63" y="146" font-family="Arial,sans-serif" font-size="42" font-weight="bold" fill="#eef3f6">KNOWLEDGE IS NOT A TOOL</text>
<text x="65" y="187" font-family="Arial,sans-serif" font-size="22" letter-spacing="3" fill="#bdcfda">IT IS THE CONTINUITY BETWEEN TOOLS</text>
