<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
<title id="title">Recursive capability and epistemic continuity</title>
<desc id="description">Three luminous knowledge, problem-solving, and capability cycles converge in a portable evidence ledger that can be handed between AI platforms.</desc>
<defs>
