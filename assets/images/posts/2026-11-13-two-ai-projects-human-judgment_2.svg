<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="ttl ds"><title id="ttl">InvoiceGuard AI 欄位命中率對照</title><desc id="ds">根據專案簡報第13頁重繪的OCR辨識比較：74.3、88.6、92.9與94.3百分比，樣本限五張發票、70欄位。</desc><rect width="1200" height="675" fill="#fafbfd"/><text x="60" y="70" font-size="21" fill="#2d6a9a" font-family="Noto Sans CJK TC,sans-serif">InvoiceGuard AI｜專案簡報數據重繪</text><text x="60" y="125" font-size="40" fill="#092e59" font-weight="bold" font-family="Noto Sans CJK TC,sans-serif">影像處理與 Few-shot：四組條件的比較</text><text x="60" y="165" font-size="18" fill="#56718c" font-family="Noto Sans CJK TC,sans-serif">欄位命中率（五張發票，共 70 欄；這一批次的比較，不代表正式系統整體辨識率）</text><g font-family="Noto Sans CJK TC,sans-serif" font-size="22" fill="#243f60"><text x="60" y="248">Zero-shot｜原圖</text><text x="60" y="337">Zero-shot｜裁切校正</text><text x="60" y="426">Few-shot｜原圖</text><text x="60" y="515">Few-shot｜裁切校正</text></g><g><rect x="365" y="214" width="600" height="42" rx="8" fill="#edf1f6"/><rect x="365" y="303" width="600" height="42" rx="8" fill="#edf1f6"/><rect x="365" y="392" width="600" height="42" rx="8" fill="#edf1f6"/><rect x="365" y="481" width="600" height="42" rx="8" fill="#edf1f6"/><rect x="365" y="214" width="446" height="42" rx="8" fill="#b1bfd3"/><rect x="365" y="303" width="532" height="42" rx="8" fill="#8facd7"/><rect x="365" y="392" width="557" height="42" rx="8" fill="#73a6e6"/><rect x="365" y="481" width="566" height="42" rx="8" fill="#276bdf"/></g><g font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#12365e"><text x="991" y="246">74.3%</text><text x="991" y="335">88.6%</text><text x="991" y="424">92.9%</text><text x="991" y="513">94.3%</text></g><rect x="60" y="573" width="1070" height="55" rx="12" fill="#e9f0f7"/><text x="83" y="608" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#315475">同時改變了裁切校正與範例提示；不可把全部差距歸因於單一技術。</text></svg>