<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="ttl ds"><title id="ttl">發票不能亂猜，故事不能亂演</title><desc id="ds">以實際專案報告圖表與互動旅程元素重新構成的雙專案文章概念封面。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c2446"/><stop offset="1" stop-color="#10294b"/></linearGradient><linearGradient id="r" x2="1"><stop stop-color="#64a1ec"/><stop offset="1" stop-color="#306be0"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="13" flood-color="#03162a" flood-opacity=".4"/></filter></defs><rect width="1200" height="675" fill="url(#bg)"/><g stroke="#9cb9d9" opacity=".09"><path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200M0 600H1200M100 0V675M300 0V675M500 0V675M700 0V675M900 0V675M1100 0V675"/></g><text x="64" y="69" fill="#88bfff" font-size="22" font-family="Noto Sans CJK TC, sans-serif">RHYZARCA / 雙專案實作紀錄</text><text x="64" y="151" fill="#fff9f1" font-size="45" font-weight="bold" font-family="Noto Sans CJK TC, sans-serif">發票不能亂猜，</text><text x="64" y="206" fill="#fff9f1" font-size="45" font-weight="bold" font-family="Noto Sans CJK TC, sans-serif">故事不能亂演。</text><text x="66" y="254" fill="#d7e7f5" font-size="21" font-family="Noto Sans CJK TC, sans-serif">兩個 AI 專案，一段人機協作的實際學習</text><rect x="64" y="293" width="505" height="292" rx="18" fill="#f7fafc" filter="url(#sh)"/><rect x="628" y="293" width="505" height="292" rx="18" fill="#f8f5ef" filter="url(#sh)"/><text x="95" y="333" fill="#164a81" font-size="22" font-weight="bold" font-family="Noto Sans CJK TC, sans-serif">InvoiceGuard AI</text><text x="95" y="363" fill="#617383" font-size="16" font-family="Noto Sans CJK TC, sans-serif">報告圖｜小樣本辨識比較</text><text x="95" y="406" fill="#304a6b" font-size="16" font-family="Noto Sans CJK TC, sans-serif">原始影像</text><rect x="232" y="383" width="223" height="26" rx="5" fill="#d9e4ef"/><rect x="232" y="383" width="166" height="26" rx="5" fill="#a8bdd6"/><text x="469" y="403" fill="#17426d" font-size="21" font-weight="bold" font-family="Arial">74.3%</text><text x="95" y="462" fill="#304a6b" font-size="16" font-family="Noto Sans CJK TC, sans-serif">前處理＋範例</text><rect x="232" y="439" width="223" height="26" rx="5" fill="#d9e4ef"/><rect x="232" y="439" width="210" height="26" rx="5" fill="url(#r)"/><text x="469" y="459" fill="#145fd0" font-size="21" font-weight="bold" font-family="Arial">94.3%</text><rect x="95" y="506" width="438" height="43" rx="8" fill="#e9eff7"/><text x="112" y="534" fill="#4f6175" font-size="16" font-family="Noto Sans CJK TC, sans-serif">5 張發票、70 欄；非正式整體辨識率</text><text x="659" y="334" fill="#236450" font-size="22" font-weight="bold" font-family="Noto Sans CJK TC, sans-serif">Life World</text><text x="659" y="364" fill="#64756e" font-size="16" font-family="Noto Sans CJK TC, sans-serif">人物、旅程與互動選擇</text><path d="M709 477Q795 398 890 449T1078 415" stroke="#9db6a5" stroke-width="5" fill="none" stroke-dasharray="11 10"/><g fill="#fff" stroke="#3e805f" stroke-width="5"><circle cx="712" cy="475" r="16"/><circle cx="892" cy="451" r="16"/><circle cx="1076" cy="416" r="16"/></g><rect x="705" y="495" width="164" height="52" rx="14" fill="#e7efe8"/><text x="735" y="529" fill="#315e43" font-size="21" font-family="Noto Sans CJK TC, sans-serif">出發</text><rect x="883" y="495" width="208" height="52" rx="14" fill="#ffedd4"/><text x="905" y="529" fill="#865a21" font-size="21" font-family="Noto Sans CJK TC, sans-serif">下一站怎麼選？</text><text x="65" y="630" fill="#a9c2d9" font-size="18" font-family="Noto Sans CJK TC, sans-serif">看得出錯誤，才能知道什麼值得交給 AI。</text></svg>