<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="ttl ds"><title id="ttl">InvoiceGuard AI RAG 來源追溯與誤答示意</title><desc id="ds">依專案報告中RAG來源連結畫面與錯誤反例重繪，說明有引用不代表條文適用。</desc><rect width="1200" height="675" fill="#fcfdfd"/><text x="65" y="75" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#386d98">InvoiceGuard AI｜RAG 問答研究</text><text x="65" y="133" font-family="Noto Sans CJK TC,sans-serif" font-size="39" font-weight="bold" fill="#14365b">有來源，不代表答案用對了規則</text><text x="65" y="176" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#63819b">依專案報告中的來源超連結功能與一次真實模型測試反例重繪</text><rect x="65" y="218" width="480" height="302" rx="18" fill="#eef4fb" stroke="#ccd9e6" stroke-width="2"/><rect x="655" y="218" width="480" height="302" rx="18" fill="#f1f8f5" stroke="#cde1d5" stroke-width="2"/><text x="95" y="269" font-size="25" font-weight="bold" fill="#204d7d" font-family="Noto Sans CJK TC,sans-serif">第一步：回答與來源連結</text><text x="95" y="317" font-size="21" fill="#30566e" font-family="Noto Sans CJK TC,sans-serif">員工問：「發票遺失怎麼辦？」</text><rect x="95" y="346" width="408" height="78" rx="11" fill="#ffffff"/><text x="116" y="379" font-size="19" fill="#486b82" font-family="Noto Sans CJK TC,sans-serif">AI 找到相關文件，附上 [2] 來源</text><text x="116" y="411" font-size="17" fill="#476f95" font-family="Noto Sans CJK TC,sans-serif">有超連結，但還得核對適用情形</text><text x="95" y="472" font-size="18" fill="#b0523e" font-family="Noto Sans CJK TC,sans-serif">測試反例：把「開錯」規則套到「遺失」</text><path d="M570 370h62" stroke="#668a9b" stroke-width="7" stroke-linecap="round"/><path d="M615 351l27 19-27 19" stroke="#668a9b" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="680" y="269" font-size="25" font-weight="bold" fill="#23654b" font-family="Noto Sans CJK TC,sans-serif">第二步：回到原文核對</text><text x="680" y="320" font-size="20" fill="#396759" font-family="Noto Sans CJK TC,sans-serif">點開條文／SOP，確認：</text><g font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#35665a"><text x="700" y="369">① 問題情境有沒有對上？</text><text x="700" y="410">② 來源是不是目前有效版本？</text><text x="700" y="451">③ 資料不足時是否該停下？</text></g><rect x="65" y="557" width="1070" height="67" rx="12" fill="#fff3df"/><text x="90" y="598" font-size="20" fill="#695536" font-family="Noto Sans CJK TC,sans-serif">畫面為報告內容的編輯重繪，非真實法規操作建議；實際規定仍須由合格人員確認。</text></svg>