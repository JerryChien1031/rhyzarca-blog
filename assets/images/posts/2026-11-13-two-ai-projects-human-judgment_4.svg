<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="ttl ds"><title id="ttl">真實資料與虛構創作需要不同的界線</title><desc id="ds">呈現InvoiceGuard AI與Life World的共同人機協作結語：可信來源和人物創作都需要人類決策與檢驗。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102b51"/><stop offset="1" stop-color="#133f3d"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)"/><text x="76" y="92" fill="#a7ddf5" font-size="20" font-family="Noto Sans CJK TC,sans-serif">RHYZARCA · TWO PROJECTS, ONE LESSON</text><text x="76" y="160" fill="#fff" font-size="41" font-weight="bold" font-family="Noto Sans CJK TC,sans-serif">讓 AI 發揮，還是讓 AI 停下來？</text><text x="76" y="211" fill="#d6e8e6" font-size="23" font-family="Noto Sans CJK TC,sans-serif">關鍵不是把所有決定交給模型，而是先說清楚什麼需要被驗證。</text><rect x="76" y="271" width="473" height="235" rx="22" fill="#ecf3f9"/><rect x="651" y="271" width="473" height="235" rx="22" fill="#f2f8ef"/><text x="104" y="323" font-size="30" font-weight="bold" fill="#255d8e" font-family="Noto Sans CJK TC,sans-serif">InvoiceGuard AI</text><text x="104" y="372" font-size="23" fill="#315974" font-family="Noto Sans CJK TC,sans-serif">真實資訊：欄位、金額、規則</text><text x="104" y="417" font-size="20" fill="#315974" font-family="Noto Sans CJK TC,sans-serif">模型辨識 → 程式檢查 → 人工確認</text><text x="104" y="469" font-size="20" fill="#9a593a" font-family="Noto Sans CJK TC,sans-serif">錯誤不能當成事實</text><text x="680" y="323" font-size="30" font-weight="bold" fill="#2d7156" font-family="Noto Sans CJK TC,sans-serif">Life World</text><text x="680" y="372" font-size="23" fill="#365e4e" font-family="Noto Sans CJK TC,sans-serif">虛構作品：人物、故事、選擇</text><text x="680" y="417" font-size="20" fill="#365e4e" font-family="Noto Sans CJK TC,sans-serif">模型創作 → 規則約束 → 讀者體驗</text><text x="680" y="469" font-size="20" fill="#a16b37" font-family="Noto Sans CJK TC,sans-serif">想像力不等於可以破壞已定的規則</text><path d="M548 392H651" stroke="#f2c486" stroke-width="5" stroke-dasharray="12 11"/><circle cx="600" cy="392" r="24" fill="#edc78f"/><text x="591" y="401" font-size="22" fill="#3c4e4d" font-family="Arial">✓</text><text x="80" y="582" fill="#fff3df" font-size="27" font-family="Noto Sans CJK TC,sans-serif">人負責提出問題與驗收，AI 幫忙探索、實作與修正。</text><text x="80" y="627" fill="#bed6dc" font-size="19" font-family="Noto Sans CJK TC,sans-serif">每次失敗留下依據，才不必從頭再犯同樣的錯。</text></svg>