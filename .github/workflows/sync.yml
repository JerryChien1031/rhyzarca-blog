name: Sync Markdown Posts to Google Blogger

on:
  push:
    branches:
      - main
    paths:
      - '_posts/**'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊執行測試

permissions:
  contents: write # 賦予寫入權限

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 檢查專案程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install python-frontmatter markdown beautifulsoup4 google-api-python-client google-auth-httplib2 google-auth-oauthlib python-dotenv

      - name: 還原授權檔案與環境變數
        env:
          CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN }}
          BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: |
          mkdir -p scripts
          echo "$CLIENT_SECRET" > scripts/client_secret.json
          echo "$TOKEN_JSON" > scripts/token.json
          echo "BLOGGER_BLOG_ID=$BLOG_ID" > scripts/.env

      - name: 執行 Blogger 同步腳本
        run: |
          cd scripts
          python sync_to_blogger.py

      - name: 清理敏感金鑰檔案
        if: always()
        run: |
          rm -f scripts/client_secret.json scripts/token.json scripts/.env

      - name: 將更新後的 blogger_post_id 回寫並提交至 GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts/*.md
          if git diff --staged --quiet; then
            echo "沒有任何 Markdown 文章的 ID 發生變更，略過提交。"
          else
            git commit -m "chore(blog): auto-update blogger_post_id [skip ci]"
            git push
          fi

