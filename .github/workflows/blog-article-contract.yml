name: Validate New Blog Article Contract

# Read-only PR verification. Never uses Blogger credentials or publishes.
on:
  pull_request:
    paths:
      - '_posts/**'
      - 'assets/images/posts/**'
      - 'docs/blog-article-contract.md'
      - 'scripts/check_blog_article_contract.py'
      - 'tests/test_blog_article_contract.py'
      - '.github/workflows/blog-article-contract.yml'

permissions:
  contents: read

jobs:
  article-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install converter dependencies and image validator
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML Pillow python-frontmatter markdown beautifulsoup4

      - name: Regression tests for the post contract
        run: python -m unittest discover -s tests -p 'test_blog_article_contract.py' -v

      - name: Verify stable Blogger permalink publisher and migration recovery
        run: python -m unittest discover -s tests -p 'test_blogger_post_permalink.py' -v

      - name: Validate changed article fields, images and official conversion
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' posts < <(git diff --name-only --diff-filter=AM -z "$BASE_SHA"...HEAD -- _posts/)
          if (( ${#posts[@]} == 0 )); then
            echo "No added or modified Markdown posts in this PR."
          else
            printf 'Checking %s article(s)\n' "${#posts[@]}"
            python scripts/check_blog_article_contract.py --verify-conversion "${posts[@]}"
          fi
