# .github/workflows/check_auth.yml
name: Weekly Blogger Auth Health Check

on:
  schedule:
    # 使用 Cron 語法設定排程
    # 這裡設定為 UTC 時間每週六 17:00（約為台灣時間每週日凌晨 01:00）
    - cron: '0 17 * * 6'
  
  # 允許手動從 GitHub 網頁觸發，方便您隨時測試
  workflow_dispatch:

jobs:
  check-auth:
    runs-on: ubuntu-latest

    steps:
      - name: 檢查專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝相依套件
        run: |
            python -m pip install --upgrade pip
            pip install python-frontmatter markdown beautifulsoup4 google-api-python-client google-auth-httplib2 google-auth-oauthlib python-dotenv

      - name: 還原授權檔案
        env:
          CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN }}
        run: |
            mkdir -p scripts
            echo "$CLIENT_SECRET" > scripts/client_secret.json
            echo "$TOKEN_JSON" > scripts/token.json

      - name: 執行 Blogger 授權健康檢查
        run: |
            cd scripts
            python check_blogger_auth.py

      - name: 清理敏感金鑰檔案
        if: always()
        run: |
            rm -f scripts/client_secret.json scripts/token.json

