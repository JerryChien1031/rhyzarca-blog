name: Prepare approved taxonomy revision
on:
  push:
    branches: ['edit/practice-explorations-taxonomy-20261114']
    paths: ['.github/workflows/prepare-taxonomy-20261114.yml']
permissions:
  contents: write
concurrency:
  group: taxonomy-preparation-20261114
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'JerryChien1031/rhyzarca-blog'
    runs-on: ubuntu-latest
    env:
      BASE_HEAD: ef05731e3f7584ffe77173da7756a03e7fbec8c4
      WORK_BRANCH: edit/practice-explorations-taxonomy-20261114
      PREP_FILE: .github/workflows/prepare-taxonomy-20261114.yml
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Record clean baseline and authorized preparation scope
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse --show-toplevel
          git rev-parse HEAD
          git status --porcelain=v1 -uall
          git diff --name-status
          git diff --cached --name-status
          test -z "$(git status --porcelain=v1 -uall)"
          test "$(git diff --name-only "$BASE_HEAD" HEAD)" = "$PREP_FILE"
          test "${GITHUB_REF#refs/heads/}" = "$WORK_BRANCH"
          echo 'Pre-existing dirty files: none (isolated Actions checkout). No Blogger credentials are used.'
          printf '_site_before/\n_site_after/\n_audit/\n.jekyll-cache/\n**/__pycache__/\n' >> .git/info/exclude
          mkdir _audit
          cat > taxonomy-routes.json <<'EOF'
          ---
          layout: null
          permalink: /taxonomy-routes.json
          ---
          [{% for post in site.posts %}{"path":{{ post.path | jsonify }},"url":{{ post.url | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}]
          EOF
      - name: Capture actual original Jekyll URLs before changing categories
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site_before
          future: true
      - name: Install existing validation dependencies
        run: python -m pip install PyYAML Pillow python-frontmatter markdown beautifulsoup4 google-api-python-client google-auth-httplib2 google-auth-oauthlib python-dotenv playwright
      - name: Apply exact approved category and definition changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, re, subprocess, sys
          import yaml
          root = Path.cwd()
          base = os.environ['BASE_HEAD']
          routes = {v['path']: v['url'] for v in json.loads(Path('_site_before/taxonomy-routes.json').read_text())}
          plan = {
            '2026-08-16-epistemic-ledger.md': (['Epistemology','Architecture'], ['insights'], '認知軌跡與網站理念，沒有具體製作方案。'),
            '2026-08-17-why-rhyzarca-origin-and-value.md': (['insights','architecture'], ['insights','architecture'], '以價值觀為主，同時提出主權狀態層及帳本設計；保留觀點與方案探索的交集。'),
            '2026-08-18-intelligence-vs-insight-gemini-notebook-changes-perception.md': (['insights','architecture'], ['insights'], '以認知、見識與決策的觀點為主，工具是論述案例。'),
            '2026-08-19-perspective-disparity-and-systemic-debt.md': (['insights','architecture'], ['insights'], '以同理、視角與社會成本的觀點為主，非具體製作紀錄。'),
            '2026-08-20-constitution-delegates-and-governance-sandboxes.md': (['insights','architecture'], ['speculations','insights'], '未來智能與治理制度推演，同時保留價值判斷的心得入口。'),
            '2026-08-23-mythology-civilizational-models.md': (['insights','epistemology'], ['speculations','insights'], '歷史假說與思想實驗，並反思認知方法；Epistemology 主題標籤仍保留。'),
            '2026-08-24-agi-civilization-human-value.md': (['insights','architecture'], ['speculations','insights'], '未來文明及人類價值推演，不把社會藍圖當成工程成果。'),
            '2026-08-27-agi-constitution-side-effects-cognitive-iteration.md': (['insights','architecture'], ['speculations'], 'BCI 與 AGI 社會體制的假設推演，以科學思辨為主要入口。'),
            '2026-08-28-rhyzarca-cognitive-system-know-yourself.md': (['insights','architecture'], ['insights','architecture'], '包含具體四層系統方案；實作探索涵蓋規劃設計，不要求已完成產品。'),
            '2026-09-15-digital-babel-rhyzarca-sovereign-continuity.md': (['insights','architecture'], ['insights','architecture'], '認知連續性觀點與保存、重建的架構方案並存；保留有內容依據的交集。'),
            '2026-10-22-claude-codex-harness-engineering-auto-workflow.md': (['architecture'], ['architecture'], '工程設計、跨平台協作、故障恢復與限定實測。'),
            '2026-11-06-from-unknown-to-human-ai-mutual-growth.md': (['insights'], ['insights'], '人機協作方法與觀點，教學情境不是本文主體的產品實作。'),
            '2026-11-13-two-ai-projects-human-judgment.md': (['insights'], ['architecture'], '兩個團隊專案從需求、研究、試錯到成果；屬實作探索。')
          }
          changed_posts = ['_posts/'+name for name,(old,new,why) in plan.items() if old != new]
          config_paths = ['_data/blog_categories.json','README.md','docs/blog-article-contract.md','docs/blog-taxonomy.md','categories.md','assets/js/blogger.js','tests/test_blog_taxonomy.py','.github/workflows/blog-article-contract.yml']
          allow = changed_posts + config_paths
          print('TASK_ALLOWLIST:', json.dumps(allow, ensure_ascii=False))
          Path('_audit/allowlist.json').write_text(json.dumps(allow))
          assert set(p.name for p in Path('_posts').glob('*.md')) == set(plan), 'Article inventory changed; stop for review.'
          assert set(routes) == {'_posts/'+n for n in plan}, 'Baseline routes must cover all 13 articles.'
          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path,text):
              assert path in allow
              p=Path(path); p.parent.mkdir(parents=True,exist_ok=True); p.write_text(text,encoding='utf-8')
          def once(text,old,new):
              assert text.count(old)==1, 'Unexpected edit anchor: '+old[:80]
              return text.replace(old,new,1)
          def split(text):
              m=re.match(r'\A---\n(.*?)\n---(?=\n|\Z)',text,re.S)
              assert m, 'Front Matter missing'
              return m,yaml.safe_load(m[1]),text[m.end():]
          receipts=[]
          for name,(expected,categories,reason) in plan.items():
              path='_posts/'+name
              original=read(path)
              assert original.encode()==subprocess.check_output(['git','show',base+':'+path]), 'Unexpected article changes'
              match,meta,body=split(original)
              assert meta['categories']==expected
              if expected != categories:
                  front,n=re.subn(r'(?m)^categories:\n(?:- [^\n]*\n)+','categories:\n'+''.join('- '+c+'\n' for c in categories),match[1]+'\n')
                  assert n==1
                  front=front.rstrip('\n')
                  assert 'permalink' not in meta, 'Existing per-article Jekyll URL requires separate review'
                  front+='\npermalink: '+json.dumps(routes[path],ensure_ascii=False)
                  revised='---\n'+front+'\n---'+body
                  _,newmeta,newbody=split(revised)
                  assert newbody==body
                  assert {k:v for k,v in newmeta.items() if k not in ('categories','permalink')}=={k:v for k,v in meta.items() if k!='categories'}
                  assert newmeta['permalink']==routes[path]
                  write(path,revised)
              receipts.append({'path':path,'title':meta['title'],'before':expected,'after':categories,'reason':reason,'body_sha256':hashlib.sha256(body.encode()).hexdigest(),'blogger_post_id':str(meta['blogger_post_id']),'jekyll_url':routes[path]})
          definitions=[
            {'id':'insights','name':'心得記錄','english':'Insights','aliases':['Epistemology','epistemology'],'summary':'對知識、工具、工作與人機協作的觀察、評析和反思；分享觀點如何形成與改變。'},
            {'id':'architecture','name':'實作探索','english':'Practice','aliases':['build-log','Architecture'],'summary':'從構想、試驗到成果，分享把問題做出解法的過程。涵蓋可行性研究、設計製作、測試除錯、維護與實作回顧；不限個人或團隊，也不以完成或成功為門檻。'},
            {'id':'embodied','name':'生活體驗','english':'Embodied','aliases':['life-and-trails'],'summary':'以親身經歷為主，記錄生活、活動、旅行、學習、工作現場、環境與身體感受。'},
            {'id':'speculations','name':'科學思辨','english':'Speculations','aliases':[],'summary':'以問題、假說與思想實驗探索科學、技術、歷史與未來社會的可能性，釐清前提、推論與待驗證之處。'}
          ]
          write('_data/blog_categories.json',json.dumps(definitions,ensure_ascii=False,indent=2)+'\n')
          text=read('README.md')
          for d in definitions:
              pattern=r'(?m)^\| \*\*`'+d['id']+r'`\*\*.*$'
              text,n=re.subn(pattern,'| **`'+d['id']+'`** | '+d['name']+' | '+d['summary']+' |',text)
              assert n==1
          start='文章分類依正文的**主要內容性質**決定：'
          a=text.index(start); b=text.index('\n',a)
          text=text[:a]+'文章分類依正文的**主要目的**決定，完整定義與逐篇對照見 [分類範圍與判斷規則](docs/blog-taxonomy.md)。`architecture` 對外顯示「實作探索」：具體目標的可行性討論、設計、個人小品、團隊合作、單元測試、除錯、教學及未完成或失敗的嘗試皆可收錄；不要求已有成品。心得與觀點保留 `insights`。不得只因提到 AI、架構或程式就歸為實作，也不因第一人稱或尚在規劃而排除。先定主要入口，另一分類須有完整內容支撐；不用為合作方式、完成階段或專案名稱增加主分類。既有分類代碼保留，`build-log` 只是舊入口別名，不另開第五類。'+text[b:]
          write('README.md',text)
          text=read('docs/blog-article-contract.md')
          a=text.index('**分類與檔名必須先經語意判斷'); b=text.index('\n\n',a)
          text=text[:a]+'**分類與檔名必須先經語意判斷，不能只靠關鍵字套範本。** 四類的正式定義見 [分類範圍與判斷規則](blog-taxonomy.md)。`insights` 為心得記錄；`architecture` 對外稱「實作探索」，涵蓋具體目標的可行性研究、設計製作、團隊或個人開發、局部實驗、單元測試、除錯、維護與回顧，**不限完成或成功的專案**；`embodied` 為生活體驗，`speculations` 為科學思辨。先依全文重心選入口，有另一條完整內容主線時才保留交集。使用者指定只有一類時遵守，不因出現 MCP／Agent 擅自增加分類，也不因規劃尚未完成而排除實作。合作方式、進度與專案名稱由開場或主題標籤說明，不另開主分類。英文 slug 反映文章題旨；禁止把內部任務代號當成公開檔名。'+text[b:]
          write('docs/blog-article-contract.md',text)
          text=read('assets/js/blogger.js')
          assert text.count('系統日誌')==2
          text=text.replace('系統日誌 (Architecture)','實作探索 (Practice)').replace('系統日誌','實作探索')
          prefix='// Generated category definitions; tests keep this snapshot aligned with _data/blog_categories.json.\nvar RHYZARCA_CATEGORIES = '+json.dumps(definitions,ensure_ascii=False)+';\n\n'
          helper='''function renderCategoryDetails() {
              var match = window.location.pathname.match(/^\\/search\\/label\\/([^/]+)\\/?$/);
              if (match) {
                  var requested;
                  try { requested = decodeURIComponent(match[1]); } catch (error) { return; }
                  var category = RHYZARCA_CATEGORIES.find(function (entry) {
                      return entry.id === requested || entry.aliases.indexOf(requested) !== -1;
                  });
                  if (category && requested !== category.id) {
                      window.location.replace('/search/label/' + category.id + window.location.search + window.location.hash);
                      return;
                  }
                  var posts = document.querySelector('#Blog1 .blog-posts, .blog-posts');
                  if (category && posts && !document.getElementById('rhyzarca-category-description')) {
                      var section = document.createElement('section');
                      section.id = 'rhyzarca-category-description';
                      section.style.cssText = 'margin:0 0 1.5rem;padding:1rem;max-width:100%;box-sizing:border-box;overflow-wrap:anywhere;';
                      var title = document.createElement('h2');
                      title.textContent = category.name;
                      var description = document.createElement('p');
                      description.textContent = category.summary;
                      section.appendChild(title);
                      section.appendChild(description);
                      posts.parentNode.insertBefore(section, posts);
                  }
              }
              document.querySelectorAll('a[href*="/search/label/"]').forEach(function (link) {
                  var url;
                  try { url = new URL(link.href, window.location.href); } catch (error) { return; }
                  if (url.origin !== window.location.origin) return;
                  var found = RHYZARCA_CATEGORIES.find(function (entry) {
                      return url.pathname === '/search/label/' + entry.id;
                  });
                  if (found && link.textContent.trim() === found.id) link.textContent = found.name;
              });
          }
          '''
          text=once(text,'document.addEventListener("DOMContentLoaded", function () {',helper+'\ndocument.addEventListener("DOMContentLoaded", function () {')
          text=once(text,'    renderCustomErrorPage();','    renderCustomErrorPage();\n    renderCategoryDetails();')
          write('assets/js/blogger.js',prefix+text)
          categories='''---
          layout: default
          title: "文章分類總覽"
          permalink: /categories/
          ---
          <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
          <h1>文章分類總覽</h1>
          <p>依文章主要目的尋找內容；有完整交集的文章可出現在多個入口。完成程度不由分類名稱保證，請以正文說明為準。</p>
          <nav aria-label="文章分類" style="display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:2rem;">
          {% for category in site.data.blog_categories %}
            <a class="post-category-tag" href="#{{ category.id }}">{{ category.name }}</a>
          {% endfor %}
          </nav>
          {% for category in site.data.blog_categories %}
          {% for alias in category.aliases %}<span id="{{ alias }}" aria-hidden="true"></span>{% endfor %}
          <section id="{{ category.id }}" style="margin-top:2.5rem;scroll-margin-top:2rem;">
            <h2>{{ category.name }} ({{ category.english }})</h2>
            <p>{{ category.summary }}</p>
            <ul class="post-list">
              {% assign category_posts = site.categories[category.id] %}
              {% for post in category_posts %}
                <li class="post-item"><div class="post-meta">{{ post.date | date: "%Y-%m-%d" }}</div><a class="post-link" href="{{ post.url | relative_url }}">{{ post.title }}</a></li>
              {% else %}
                <li class="post-item">目前此分類尚無文章。</li>
              {% endfor %}
            </ul>
          </section>
          {% endfor %}
          '''
          import textwrap
          write('categories.md',textwrap.dedent(categories))
          table='\n'.join('| '+r['title']+' | '+', '.join(r['before'])+' | '+', '.join(r['after'])+' | '+r['reason']+' |' for r in receipts)
          doc='''# Rhyzarca Blog｜分類範圍與判斷規則

          2026-11-14 經作者確認：「系統日誌」重新定位為「實作探索」。保留四類與既有代碼，不增加第五個主分類。機器可讀對照為 `_data/blog_categories.json`。

          ## 四個入口
          - **心得記錄（insights）**：對知識、工具、工作、社會、人機協作與個人經驗的理解、觀察、評析和反思；重點是觀點如何形成與改變。
          - **實作探索（architecture）**：圍繞具體的製作、應用或改善目標，分享方案構思、可行性研究、設計製作、測試除錯，以及成果與後續改進。不限個人或團隊、軟硬體或創作流程、大型專案或小品，也不以完成或成功為門檻。
          - **生活體驗（embodied）**：以親身經歷為主的生活、活動、旅行、學習、工作現場、環境與身體感受。
          - **科學思辨（speculations）**：以問題、假說與思想實驗探索科學、技術、歷史或未來社會，討論前提、推論、替代解釋與待驗證之處。

          ## 實作探索的範圍
          可行性討論、需求研究、方案比較、架構設計、團隊專案、個人小工具、學習練習、資料處理、介面或互動作品、AI 工作流程、單元與整合測試、評估實驗、除錯重構、部署維護、交接、操作教學、失敗紀錄與實作回顧，都可以收錄。每篇只談其中一個環節也成立，不要求所有文章都有程式碼或成品。

          核心是「想做什麼、處理哪個問題、如何推進或驗證」。規劃尚未開始製作也能是實作探索；但只談文明可能性、引用工程術語，並不自動成為實作。

          ## 邊界與交集
          1. 先看全文的主要目的，再看文風。第一人稱和結語反思不會把實作自動變成心得。
          2. 有另一條完整內容主線時可保留次要分類，不強制所有舊文互斥，也不為增加曝光全選。
          3. 團隊／個人是合作方式，規劃／原型／已部署是進度，Life World 等是專案，RAG／Agent 等是主題；它們不另立主分類。
          4. 「實作探索」不宣稱驗收成功。完成程度、樣本限制、失敗與未驗證事項在正文交代。
          5. 指定單一分類的作者要求優先。不得只見 MCP、AI、架構或程式就加上 architecture。
          6. insights 不刪除、不改作實作的別名；embodied 暫無文章也保留其內容方向。

          ## 2026-11-14 既有文章審閱
          下表是本次逐篇判斷，不是以標題關鍵字自動分類。保留有內容依據的重疊；未列為修改的正文與分類不擅動。

          | 文章 | 原分類 | 本次分類 | 理由 |
          | --- | --- | --- | --- |
          '''
          doc=textwrap.dedent(doc)+table+'''\n
          ## 相容性與發布
          `architecture` 是歷史技術代碼，公開名稱為「實作探索」，不改成新的 slug。`build-log`／`Architecture`、`life-and-trails` 等舊入口保留別名，不新增分類。`Epistemology`／`epistemology` 原分類歸入經審閱的正式入口；原有主題 tags 不刪除。

          本次只改八篇文章的 categories；Blogger ID、標題、日期、slug、tags、正文、圖檔與作品連結不變。因 Jekyll 原設定把 categories 放進文章 URL，從實際變更前建置取得既有 URL，再以每篇 permalink 固定原路徑，避免舊連結失效。Blogger 更新既有 Post，不建立新文章。

          GitHub、Blogger 導覽、404 分類入口、標籤文字及分類說明同步使用四類定義。分類頁由 `_data/blog_categories.json` 產生；Blogger 腳本內的對照由測試比對，防止兩邊名稱再分歧。原始發文 Workflow 的同步範圍不變。
          '''
          write('docs/blog-taxonomy.md',textwrap.dedent(doc))
          tests='''import json
          import re
          import unittest
          from pathlib import Path
          import frontmatter

          ROOT = Path(__file__).resolve().parents[1]
          class TaxonomyTests(unittest.TestCase):
              def setUp(self):
                  self.categories=json.loads((ROOT/'_data/blog_categories.json').read_text())
                  self.ids={c['id'] for c in self.categories}
              def test_four_categories_and_names(self):
                  self.assertEqual(self.ids,{'insights','architecture','embodied','speculations'})
                  self.assertEqual(next(c['name'] for c in self.categories if c['id']=='architecture'),'實作探索')
              def test_all_posts_use_canonical_categories(self):
                  for path in (ROOT/'_posts').glob('*.md'):
                      with self.subTest(path=path.name):
                          categories=frontmatter.load(path)['categories']
                          self.assertTrue(categories)
                          self.assertEqual(len(categories),len(set(categories)))
                          self.assertTrue(set(categories)<=self.ids)
              def test_blogger_snapshot_matches_source(self):
                  js=(ROOT/'assets/js/blogger.js').read_text()
                  match=re.search(r'var RHYZARCA_CATEGORIES = (.*);',js)
                  self.assertIsNotNone(match)
                  self.assertEqual(json.loads(match[1]),self.categories)
                  self.assertNotIn('系統日誌',js)
                  self.assertIn('實作探索 (Practice)',js)
              def test_category_page_uses_canonical_source_and_aliases(self):
                  text=(ROOT/'categories.md').read_text()
                  self.assertIn('site.data.blog_categories',text)
                  self.assertIn('site.categories[category.id]',text)
                  self.assertIn('category.aliases',text)
                  self.assertNotIn('site.categories.build-log',text)
              def test_examples_keep_distinct_reading_purposes(self):
