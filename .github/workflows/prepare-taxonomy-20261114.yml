      - name: Build changed Jekyll site and verify URL compatibility
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site_after
          future: true
      - name: Check URLs, conversion identity and mobile category navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,shutil,subprocess,sys
          from bs4 import BeautifulSoup
          import frontmatter
          from playwright.sync_api import sync_playwright
          before=json.loads(Path('_audit/before-routes.json').read_text())
          after={r['path']:r['url'] for r in json.loads(Path('_site_after/taxonomy-routes.json').read_text())}
          assert before==after,'Jekyll article URLs changed'
          sys.path.insert(0,str(Path('scripts').resolve()))
          from markdown_parser import parse_and_convert
          receipts=json.loads(Path('_audit/articles.json').read_text())
          for r in receipts:
              old=subprocess.check_output(['git','show',os.environ['BASE_HEAD']+':'+r['path']]).decode()
              previous=frontmatter.loads(old)
              current=frontmatter.load(r['path'])
              assert previous.content==current.content
              assert str(current['blogger_post_id'])==r['blogger_post_id']
              assert previous.get('blogger_post_url')==current.get('blogger_post_url')
              assert previous.get('blogger_permalink_slug')==current.get('blogger_permalink_slug')
              assert previous['tags']==current['tags']
              m,html=parse_and_convert(r['path'])
              soup=BeautifulSoup(html,'html.parser')
              if r['path'].endswith('two-ai-projects-human-judgment.md'):
                  assert len(soup.select('iframe'))==3
                  assert all('/assets/articles/' in f['src'] for f in soup.select('iframe'))
                  assert not any('github.com/' in a.get('href','') for a in soup.select('a'))
          built=BeautifulSoup(Path('_site_after/categories/index.html').read_text(),'html.parser')
          assert len(built.select('section'))==4
          assert '從行政痛點到互動世界' in built.select_one('#architecture').get_text()
          assert '從行政痛點到互動世界' not in built.select_one('#insights').get_text()
          chrome=shutil.which('google-chrome') or shutil.which('chromium')
          if not chrome: subprocess.run([sys.executable,'-m','playwright','install','chromium'],check=True)
          fixture='<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><header class="header">Rhyzarca</header><main id="Blog1"><div class="blog-posts"><article><a rel="tag" href="/search/label/architecture">architecture</a><p>分類展示驗收</p></article></div></main></body></html>'
          with sync_playwright() as p:
              browser=p.chromium.launch(executable_path=chrome) if chrome else p.chromium.launch()
              for width in (1280,390):
                  page=browser.new_page(viewport={'width':width,'height':900})
                  page.route('**/*',lambda route:route.fulfill(body=fixture,content_type='text/html'))
                  page.goto('https://blog.rhyzarca.com/search/label/architecture?m=1')
                  page.add_style_tag(content=Path('assets/css/blogger.css').read_text())
                  page.add_script_tag(content=Path('assets/js/blogger.js').read_text())
                  page.evaluate("document.dispatchEvent(new Event('DOMContentLoaded'))")
                  assert page.locator('#rhyzarca-nav a[href="/search/label/architecture"]').inner_text()=='實作探索 (Practice)'
                  assert page.locator('#rhyzarca-category-description').count()==1
                  assert '可行性研究' in page.locator('#rhyzarca-category-description').inner_text()
                  assert page.locator('a[rel="tag"]').inner_text()=='實作探索'
                  assert page.locator('#rhyzarca-nav a[href="/search/label/insights"]').count()==1
                  assert page.evaluate('document.documentElement.scrollWidth <= innerWidth + 1')
                  page.screenshot(path=f'_audit/category-{width}.png',full_page=True)
                  page.close()
              browser.close()
          Path('_audit/verification.json').write_text(json.dumps({'articles_checked':len(receipts),'category_edits':sum(r['before']!=r['after'] for r in receipts),'same_blogger_id_body_tags_and_demo_links':True,'all_jekyll_urls_preserved':True,'desktop_and_mobile_fixture_checked':[1280,390],'live_blogger_checked':False},ensure_ascii=False,indent=2))
          print('VERIFICATION:',Path('_audit/verification.json').read_text())
          Path('taxonomy-routes.json').unlink()
          PY
      - name: Commit only authorized changes and remove this temporary preparer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          allow=json.loads(Path('_audit/allowlist.json').read_text())
          prep=os.environ['PREP_FILE']
          changed=set(subprocess.check_output(['git','diff','--name-only']).decode().splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard']).decode().splitlines())
          assert changed|untracked<=set(allow),(changed,untracked)
          subprocess.run(['git','add','--',*allow],check=True)
          subprocess.run(['git','rm','--',prep],check=True)
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines())
          assert staged<=set(allow)|{prep}
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','diff','--cached','--stat'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','feat(blog): define 實作探索 and align related articles without changing URLs'],check=True)
          subprocess.run(['git','show','--stat','--oneline','HEAD'],check=True)
          subprocess.run(['git','show','--name-status','--format=','HEAD'],check=True)
          receipt={'task':'Approved 實作探索 taxonomy and related articles','base_head':os.environ['BASE_HEAD'],'preexisting_dirty':[],'authorized_files':allow,'committed_files':sorted(staged),'excluded':['AGENTS.md','docs/codex-workflow.md','article bodies','images','HTML demos','Blogger identities','.github/workflows/sync.yml'],'commit':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'push_target':os.environ['WORK_BRANCH'],'publication':'none; isolated branch only'}
          Path('_audit/commit-receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2))
          print('COMMIT_RECEIPT:',json.dumps(receipt,ensure_ascii=False))
          PY
          git push origin "HEAD:refs/heads/$WORK_BRANCH"
